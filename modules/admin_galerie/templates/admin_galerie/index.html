{% extends "backend_base.html" %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Médiathèque</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/Dashboard">Accueil</a></li><li class="breadcrumb-item active">Médiathèque</li></ol></nav>
  </div>
  <section class="section">
    <div class="row g-3 mb-2">
      <div class="col-6 col-md-3"><div class="card"><div class="card-body py-3"><div class="text-muted small">Total</div><div class="fs-4 fw-semibold" id="statTotal">0</div></div></div></div>
      <div class="col-6 col-md-3"><div class="card"><div class="card-body py-3"><div class="text-muted small">Actifs</div><div class="fs-4 fw-semibold text-success" id="statActifs">0</div></div></div></div>
      <div class="col-6 col-md-3"><div class="card"><div class="card-body py-3"><div class="text-muted small">Images</div><div class="fs-4 fw-semibold text-primary" id="statImages">0</div></div></div></div>
      <div class="col-6 col-md-3"><div class="card"><div class="card-body py-3"><div class="text-muted small">Vidéos</div><div class="fs-4 fw-semibold text-danger" id="statVideos">0</div></div></div></div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
          <h5 class="card-title mb-0">Médias <span id="totalCount" class="badge bg-light text-primary border border-primary fw-normal ms-1"></span></h5>
          <button type="button" class="btn btn-primary btn-sm" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Ajouter un média</button>
        </div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
          <div class="d-flex flex-wrap gap-2">
            <select id="typeFilter" class="form-select form-select-sm" style="width:150px;" onchange="reload()">
              <option value="">Tous les types</option>
              <option value="image">Images</option>
              <option value="video">Vidéos</option>
              <option value="audio">Audios</option>
              <option value="document">Documents</option>
              <option value="link">Liens</option>
              <option value="autre">Autres</option>
            </select>
            <div class="position-relative" style="max-width:320px;width:100%;"><i class="bi bi-search position-absolute start-0 top-50 translate-middle ms-2 text-muted" style="font-size:.85rem;"></i><input type="text" id="searchInput" class="form-control form-control-sm ps-4" placeholder="Rechercher un média..."></div>
          </div>
          <div class="d-flex align-items-center gap-2 text-muted small"><span>Par page :</span><select id="perPage" class="form-select form-select-sm" style="width:90px;" onchange="reload()"><option value="12">12</option><option value="24" selected>24</option><option value="48">48</option></select></div>
        </div>
        <div id="cards" class="row g-3"></div>
        <div id="empty" class="text-center text-muted py-5 d-none"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun média trouvé.</div>
        <div id="loading" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="text-muted">Chargement...</span></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"><span id="pageInfo" class="text-muted small"></span><nav><ul class="pagination pagination-sm mb-0" id="pager"></ul></nav></div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">Ajouter un média</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="editForm" onsubmit="return save(event)">
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-8"><label class="form-label">Titre <span class="text-danger">*</span></label><input type="text" name="titre" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">Type <span class="text-danger">*</span></label><select name="type" id="typeSelect" class="form-select" onchange="syncType()"><option value="image">Image</option><option value="video">Vidéo</option><option value="audio">Audio</option><option value="document">Document</option><option value="link">Lien externe</option><option value="autre">Autre</option></select></div>
          <div class="col-12" id="fileGroup"><label class="form-label">Fichier <span class="text-danger">*</span></label><input type="file" name="file" id="fileInput" class="form-control"></div>
          <div class="col-12 d-none" id="linkGroup"><label class="form-label">URL externe <span class="text-danger">*</span></label><input type="url" name="lien" id="linkInput" class="form-control" placeholder="https://..."></div>
          <div class="col-md-6"><label class="form-label">Miniature (URL ou chemin)</label><input type="text" name="miniature" id="miniatureInput" class="form-control mb-2"><input type="file" id="thumbInput" class="form-control form-control-sm" accept="image/*"></div>
          <div class="col-md-6"><label class="form-label">Catégorie</label><input type="text" name="categorie" class="form-control" list="categoriesList" autocomplete="off"><datalist id="categoriesList"></datalist></div>
          <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date_media" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">Crédits</label><input type="text" name="credits" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">Sous-type</label><input type="text" name="sous_type" class="form-control"></div>
          <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
          <div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="est_actif" id="est_actif" checked><label class="form-check-label" for="est_actif">Actif</label></div></div>
          <div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_for_website" id="is_for_website"><label class="form-check-label" for="is_for_website">Site web</label></div></div>
          <div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_for_whatsapp" id="is_for_whatsapp"><label class="form-check-label" for="is_for_whatsapp">WhatsApp</label></div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
    </form>
  </div></div>
</div>

<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="viewTitle">Aperçu</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body text-center" id="viewBody"></div>
    <div class="modal-footer" id="viewFooter"></div>
  </div></div>
</div>

{% endblock %}
{% block extra_js %}
<script>
let rows = [], meta = { page: 1, pages: 1, total: 0 }, current = null, searchTimer = null;
const ICONS = { image: 'bi-image', video: 'bi-camera-video', audio: 'bi-music-note-beamed', document: 'bi-file-earmark-text', link: 'bi-link-45deg', autre: 'bi-folder' };
function asset(path) { return path ? (path.startsWith('http') ? path : '/' + path) : ''; }
function preview(r) {
  const src = r.miniature ? asset(r.miniature) : (r.type === 'image' || r.type === 'video' ? asset(r.fichier) : '');
  if (src) return '<img src="' + API.esc(src) + '" class="card-img-top" style="height:150px;object-fit:cover;" onerror="this.style.display=\'none\'">';
  return '<div class="d-flex align-items-center justify-content-center bg-light text-muted" style="height:150px;"><i class="bi ' + (ICONS[r.type] || 'bi-folder') + ' fs-1"></i></div>';
}
function safeLink(url) { return /^https?:\/\//i.test(url || '') ? url : ''; }
function viewMedia(id) {
  const r = rows.find(x => x.id_media == id); if (!r) return;
  const body = document.getElementById('viewBody');
  const footer = document.getElementById('viewFooter');
  const src = r.fichier ? asset(r.fichier) : (r.miniature ? asset(r.miniature) : '');
  const link = safeLink(r.lien);
  document.getElementById('viewTitle').textContent = r.titre || 'Aperçu';
  body.innerHTML = ''; footer.innerHTML = '';
  if (r.type === 'image') {
    body.innerHTML = src ? '<img src="' + API.esc(src) + '" class="img-fluid rounded" style="max-height:70vh;">' : '<p class="text-muted">Image indisponible.</p>';
    if (src) footer.innerHTML = '<a class="btn btn-outline-primary" href="' + API.esc(src) + '" target="_blank" rel="noopener">Ouvrir</a>';
  } else if (r.type === 'video') {
    if (src) {
      body.innerHTML = '<video controls style="width:100%;max-height:70vh;"><source src="' + API.esc(src) + '"></video>';
      footer.innerHTML = '<a class="btn btn-outline-primary" href="' + API.esc(src) + '" download>Télécharger</a>';
    } else if (link) {
      body.innerHTML = '<div class="ratio ratio-16x9"><iframe src="' + API.esc(link) + '" allowfullscreen></iframe></div>';
      footer.innerHTML = '<a class="btn btn-outline-info" href="' + API.esc(link) + '" target="_blank" rel="noopener">Ouvrir le lien</a>';
    } else {
      body.innerHTML = '<p class="text-muted">Aucun fichier associé à ce média.</p>';
    }
  } else if (r.type === 'audio') {
    if (src) {
      body.innerHTML = '<audio controls style="width:100%;"><source src="' + API.esc(src) + '"></audio>';
      footer.innerHTML = '<a class="btn btn-outline-primary" href="' + API.esc(src) + '" download>Télécharger</a>';
    } else {
      body.innerHTML = '<p class="text-muted">Aucun fichier audio associé.</p>';
    }
  } else if (r.type === 'document') {
    body.innerHTML = '<i class="bi bi-file-earmark-text fs-1 text-warning"></i><p class="mt-2 mb-0">' + API.esc(r.mime_type || 'Document') + '</p>';
    if (src) footer.innerHTML = '<a class="btn btn-outline-primary" href="' + API.esc(src) + '" target="_blank" rel="noopener">Ouvrir</a><a class="btn btn-outline-secondary ms-2" href="' + API.esc(src) + '" download>Télécharger</a>';
  } else if (r.type === 'link') {
    body.innerHTML = '<i class="bi bi-link-45deg fs-1 text-info"></i><p class="mt-2 text-truncate">' + API.esc(link || r.lien || '') + '</p>';
    if (link) footer.innerHTML = '<a class="btn btn-outline-info" href="' + API.esc(link) + '" target="_blank" rel="noopener noreferrer">Visiter le lien</a>';
  } else {
    body.innerHTML = '<p class="text-muted">Aperçu non disponible.</p>';
    if (src) footer.innerHTML = '<a class="btn btn-outline-primary" href="' + API.esc(src) + '" download>Télécharger</a>';
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('viewModal')).show();
}
async function loadCategories() {
  const dl = document.getElementById('categoriesList');
  if (!dl) return;
  const r = await API.get('api/admin/media/categories');
  if (!r.success) return;
  dl.innerHTML = (r.data || []).map(c => '<option value="' + API.esc(c) + '"></option>').join('');
}
function card(r) {
  return '<div class="col-12 col-sm-6 col-xl-4 col-xxl-3"><div class="card h-100 shadow-sm">' + preview(r) +
    '<div class="card-body p-3"><div class="d-flex justify-content-between align-items-start gap-2"><div class="fw-semibold text-truncate">' + API.esc(r.titre || '(sans titre)') + '</div>' +
    (r.est_actif == 1 ? '<span class="badge bg-success">Actif</span>' : '<span class="badge bg-secondary">Masqué</span>') + '</div>' +
    '<div class="small text-muted text-truncate mt-1">' + (ICONS[r.type] ? '<i class="bi ' + ICONS[r.type] + ' me-1"></i>' : '') + API.esc(r.type || '') + (r.categorie ? ' · ' + API.esc(r.categorie) : '') + '</div>' +
    (r.description ? '<div class="small text-muted mt-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + API.esc(r.description) + '</div>' : '') +
    '<div class="d-flex justify-content-between align-items-center mt-3"><div class="small text-muted">' + (r.taille ? (Math.round(r.taille / 1024) + ' Ko') : (r.duree ? r.duree + ' s' : '')) + '</div>' +
    '<div class="d-flex align-items-center"><div class="form-check form-switch me-2 mb-0" title="Afficher sur le site"><input class="form-check-input" type="checkbox" ' + (r.is_for_website == 1 ? 'checked' : '') + ' onchange="toggleField(' + r.id_media + ', \'is_for_website\', this.checked)"></div>' +
    '<div class="text-nowrap"><button class="btn btn-sm btn-outline-info me-1" onclick="viewMedia(' + r.id_media + ')" title="Aperçu"><i class="bi bi-eye"></i></button>' +
    '<button class="btn btn-sm btn-outline-primary me-1" onclick="openModal(' + r.id_media + ')"><i class="bi bi-pencil"></i></button>' +
    '<button class="btn btn-sm btn-outline-danger" onclick="remove(' + r.id_media + ')"><i class="bi bi-trash"></i></button></div></div></div></div></div>';
}
function renderPager() {
  const ul = document.getElementById('pager'); ul.innerHTML = '';
  const add = (label, page, disabled, active) => {
    const li = document.createElement('li'); li.className = 'page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : '');
    li.innerHTML = '<a class="page-link" href="#" onclick="gotoPage(' + page + ');return false;">' + label + '</a>'; ul.appendChild(li);
  };
  add('&laquo;', meta.page - 1, meta.page <= 1, false);
  for (let p = Math.max(1, meta.page - 2); p <= Math.min(meta.pages, meta.page + 2); p++) add(p, p, false, p === meta.page);
  add('&raquo;', meta.page + 1, meta.page >= meta.pages, false);
}
async function loadStats() {
  const r = await API.get('api/admin/media/stats');
  if (!r.success) return;
  const d = r.data || {}, t = d.par_type || {};
  document.getElementById('statTotal').textContent = d.total || 0;
  document.getElementById('statActifs').textContent = d.actifs || 0;
  document.getElementById('statImages').textContent = t.image || 0;
  document.getElementById('statVideos').textContent = t.video || 0;
}
async function loadList() {
  const type = document.getElementById('typeFilter').value;
  const search = document.getElementById('searchInput').value;
  const limit = document.getElementById('perPage').value;
  const r = await API.get('api/admin/media?page=' + meta.page + '&limit=' + limit + '&type=' + encodeURIComponent(type) + '&search=' + encodeURIComponent(search));
  document.getElementById('loading').classList.add('d-none');
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  rows = (r.data && r.data.medias) || []; meta = (r.data && r.data.pagination) || meta;
  document.getElementById('cards').innerHTML = rows.map(card).join('');
  document.getElementById('empty').classList.toggle('d-none', rows.length > 0);
  document.getElementById('totalCount').textContent = meta.total;
  document.getElementById('pageInfo').textContent = meta.total ? ('Page ' + meta.page + ' sur ' + meta.pages) : '';
  renderPager();
}
function reload() { meta.page = 1; document.getElementById('loading').classList.remove('d-none'); loadList(); }
function gotoPage(p) { if (p < 1 || p > meta.pages) return; meta.page = p; loadList(); }
function syncType() {
  const link = document.getElementById('typeSelect').value === 'link';
  document.getElementById('fileGroup').classList.toggle('d-none', link);
  document.getElementById('linkGroup').classList.toggle('d-none', !link);
  document.getElementById('fileInput').required = !link;
  document.getElementById('linkInput').required = link;
}
function openModal(id) {
  const f = document.getElementById('editForm'); f.reset(); f.dataset.id = ''; current = null;
  document.getElementById('modalTitle').textContent = 'Ajouter un média';
  document.getElementById('typeSelect').disabled = false; document.getElementById('fileInput').required = false;
  syncType();
  if (id) {
    const r = rows.find(x => x.id_media == id); if (!r) return; current = r;
    document.getElementById('modalTitle').textContent = 'Modifier le média';
    f.dataset.id = r.id_media;
    f.titre.value = r.titre || ''; document.getElementById('typeSelect').value = r.type || 'autre'; document.getElementById('typeSelect').disabled = true;
    f.categorie.value = r.categorie || ''; f.date_media.value = (r.date_media || '').substring(0, 10); f.credits.value = r.credits || ''; f.sous_type.value = r.sous_type || ''; f.description.value = r.description || '';
    document.getElementById('miniatureInput').value = r.miniature || ''; document.getElementById('linkInput').value = r.lien || '';
    document.getElementById('est_actif').checked = r.est_actif == 1; document.getElementById('is_for_website').checked = r.is_for_website == 1; document.getElementById('is_for_whatsapp').checked = r.is_for_whatsapp == 1;
    document.getElementById('fileGroup').classList.add('d-none'); document.getElementById('linkGroup').classList.add('d-none');
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal')).show();
}
async function save(e) {
  e.preventDefault();
  const f = document.getElementById('editForm'), id = f.dataset.id;
  if (id) {
    const data = { titre: f.titre.value, categorie: f.categorie.value, date_media: f.date_media.value, credits: f.credits.value, sous_type: f.sous_type.value, description: f.description.value, miniature: document.getElementById('miniatureInput').value, est_actif: document.getElementById('est_actif').checked ? 1 : 0, is_for_website: document.getElementById('is_for_website').checked ? 1 : 0, is_for_whatsapp: document.getElementById('is_for_whatsapp').checked ? 1 : 0 };
    if (current && current.type === 'link') data.lien = document.getElementById('linkInput').value;
    const r = await API.post('api/admin/media/' + id + '/update', data);
    if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
    const thumb = document.getElementById('thumbInput').files[0];
    if (thumb) {
      const fd = new FormData(); fd.append('file', thumb);
      const tr = await (await fetch('/api/admin/media/' + id + '/thumbnail', { method: 'POST', headers: { 'X-CSRFToken': CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' }, body: fd })).json();
      if (!tr.success) return API.simpleAlert('error', 'Erreur', tr.message);
    }
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    await Promise.all([loadList(), loadStats()]);
    return API.simpleAlert('success', 'Succès', r.message);
  }
  const type = document.getElementById('typeSelect').value;
  const fd = new FormData();
  fd.append('titre', f.titre.value); fd.append('type', type); fd.append('categorie', f.categorie.value);
  fd.append('date_media', f.date_media.value); fd.append('credits', f.credits.value); fd.append('sous_type', f.sous_type.value); fd.append('description', f.description.value);
  fd.append('miniature', document.getElementById('miniatureInput').value); fd.append('lien', document.getElementById('linkInput').value);
  fd.append('est_actif', document.getElementById('est_actif').checked ? 1 : 0);
  fd.append('is_for_website', document.getElementById('is_for_website').checked ? 1 : 0);
  fd.append('is_for_whatsapp', document.getElementById('is_for_whatsapp').checked ? 1 : 0);
  if (type !== 'link' && document.getElementById('fileInput').files[0]) fd.append('file', document.getElementById('fileInput').files[0]);
  if (document.getElementById('thumbInput').files[0]) fd.append('thumbnail_file', document.getElementById('thumbInput').files[0]);
  const res = await fetch('/api/admin/media/create', { method: 'POST', headers: { 'X-CSRFToken': CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' }, body: fd });
  const r = await res.json();
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
  await Promise.all([loadList(), loadStats()]);
  return API.simpleAlert('success', 'Succès', r.message);
}
async function toggleField(id, field, checked) {
  const r = await API.post('api/admin/media/' + id + '/toggle', { field: field, value: checked ? 1 : 0 });
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  const row = rows.find(x => x.id_media == id); if (row) row[field] = checked ? 1 : 0;
}
async function remove(id) {
  const c = await API.confirm('Supprimer', 'Supprimer définitivement ce média ?'); if (!c.isConfirmed) return;
  const r = await API.post('api/admin/media/' + id + '/delete', {});
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  await Promise.all([loadList(), loadStats()]); API.simpleAlert('success', 'Succès', r.message);
}
document.getElementById('searchInput').addEventListener('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(reload, 350); });
document.getElementById('editForm').date_media.value = new Date().toISOString().substring(0, 10);
const CURRENT_TYPE = "{{ current_type|default:'' }}";
if (CURRENT_TYPE) document.getElementById('typeFilter').value = CURRENT_TYPE;
syncType(); loadCategories(); loadStats(); loadList();
</script>
{% endblock %}
