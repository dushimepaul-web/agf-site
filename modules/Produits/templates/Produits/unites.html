{% extends "backend_base.html" %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Unités d'affaires</h1>
    <nav><ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/Dashboard">Accueil</a></li>
      <li class="breadcrumb-item">Produits</li>
      <li class="breadcrumb-item active">Unités d'affaires</li>
    </ol></nav>
  </div>

  <section class="section">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
          <h5 class="card-title mb-0">Liste des unités <span id="tableCount" class="badge bg-light text-primary border border-primary fw-normal ms-1"></span></h5>
          <button type="button" class="btn btn-primary btn-sm" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Ajouter</button>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
          <div class="position-relative" style="max-width:300px;width:100%;">
            <i class="bi bi-search position-absolute start-0 top-50 translate-middle ms-2 text-muted" style="font-size:.85rem;"></i>
            <input type="text" id="tableSearch" class="form-control form-control-sm ps-4" placeholder="Rechercher une unité...">
          </div>
          <div class="d-flex align-items-center gap-2 text-muted small">
            <span>Lignes :</span>
            <select id="tblPerPage" class="form-select form-select-sm" style="width:90px;"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option></select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr>
              <th>#</th><th>Unité</th><th>Code</th><th>Slogan</th><th class="text-center">Ordre</th><th>Statut</th><th class="text-end">Actions</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="tableEmpty" class="text-center text-muted py-5 d-none"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune unité trouvée.</div>
          <div id="tableLoading" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="text-muted">Chargement...</span></div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"><span id="tableInfo" class="text-muted small"></span><nav><ul class="pagination pagination-sm mb-0" id="tblPager"></ul></nav></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle">Ajouter une unité</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="editForm" onsubmit="return save(event)">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Code <span class="text-danger">*</span></label><input type="text" name="code" class="form-control text-uppercase" required></div>
            <div class="col-md-8"><label class="form-label">Nom <span class="text-danger">*</span></label><input type="text" name="nom" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Slug</label><input type="text" name="slug" class="form-control" placeholder="laisser vide pour générer"></div>
            <div class="col-md-6"><label class="form-label">Slogan</label><input type="text" name="slogan" class="form-control"></div>
            <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4"></textarea></div>
            <div class="col-md-8">
              <label class="form-label">Logo</label>
              <div class="input-group"><input type="text" name="logo" class="form-control" placeholder="attachments/Unites/..."><button type="button" class="btn btn-outline-primary" onclick="document.getElementById('logoInput').click()"><i class="bi bi-upload"></i></button></div>
              <input type="file" id="logoInput" class="d-none" accept="image/jpeg,image/png,image/gif,image/webp">
              <img id="logoPreview" src="" alt="" class="mt-2 rounded border d-none" style="max-height:100px;">
            </div>
            <div class="col-md-4">
              <label class="form-label">Ordre</label><input type="number" name="ordre" class="form-control mb-2" value="0">
              <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="est_actif" id="est_actif" checked><label class="form-check-label" for="est_actif">Actif</label></div>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
{% block extra_js %}
<script src="/assets/js/localisation-table.js"></script>
<script>
let rows = [], gt = null;
const editId = {{ edit_id|default:"0" }};

function renderRow(r, num) {
  const badge = r.est_actif == 1 ? '<span class="badge bg-success">Actif</span>' : '<span class="badge bg-secondary">Inactif</span>';
  return '<tr><td class="text-muted">' + num + '</td><td><div class="d-flex align-items-center gap-2">' + (r.logo ? '<img src="/' + API.esc(r.logo) + '" style="width:38px;height:38px;object-fit:cover;border-radius:6px;">' : '') + '<span class="fw-semibold">' + API.esc(r.nom) + '</span></div></td><td><code>' + API.esc(r.code) + '</code></td><td>' + API.esc(r.slogan || '—') + '</td><td class="text-center"><span class="badge bg-light text-dark border">' + (r.ordre || 0) + '</span></td><td>' + badge + '</td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="openModal(' + r.id + ')" title="Modifier"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="remove(' + r.id + ')" title="Supprimer"><i class="bi bi-trash"></i></button></td></tr>';
}
function searchTerms(r) { return [r.nom, r.code, r.slogan, r.description].join(' '); }
async function loadTable() {
  const res = await API.get('api/admin/business-units');
  if (!res.success) return API.simpleAlert('error', 'Erreur', res.message);
  rows = res.data || [];
  gt.setRows(rows);
  if (editId) openModal(editId);
}
function openModal(id) {
  const f = document.getElementById('editForm');
  f.reset(); f.dataset.id = '';
  document.getElementById('modalTitle').textContent = 'Ajouter une unité';
  document.getElementById('logoPreview').classList.add('d-none');
  if (id) {
    const r = rows.find(x => x.id == id);
    if (!r) return;
    document.getElementById('modalTitle').textContent = "Modifier l'unité";
    f.dataset.id = r.id;
    f.code.value = r.code || ''; f.nom.value = r.nom || ''; f.slug.value = r.slug || '';
    f.slogan.value = r.slogan || ''; f.description.value = r.description || '';
    f.ordre.value = r.ordre ?? 0; f.logo.value = r.logo || ''; f.est_actif.checked = r.est_actif == 1;
    if (r.logo) { const img = document.getElementById('logoPreview'); img.src = '/' + r.logo; img.classList.remove('d-none'); }
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal')).show();
}
document.getElementById('logoInput').addEventListener('change', async function () {
  if (!this.files || !this.files[0]) return;
  const fd = new FormData(); fd.append('file', this.files[0]);
  const res = await fetch('/api/admin/business-units/upload', { method: 'POST', headers: { 'X-CSRFToken': CSRF_TOKEN, 'X-Requested-With': 'XMLHttpRequest' }, body: fd });
  const r = await res.json();
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  const f = document.getElementById('editForm');
  f.logo.value = r.data.path;
  const img = document.getElementById('logoPreview'); img.src = '/' + r.data.path; img.classList.remove('d-none');
});
async function save(e) {
  e.preventDefault();
  const f = document.getElementById('editForm');
  const data = { code: f.code.value, nom: f.nom.value, slug: f.slug.value, slogan: f.slogan.value, description: f.description.value, logo: f.logo.value, ordre: f.ordre.value, est_actif: f.est_actif.checked ? 1 : 0 };
  const id = f.dataset.id;
  const res = id ? await API.post('api/admin/business-units/' + id + '/update', data) : await API.post('api/admin/business-units', data);
  if (res.success) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); await loadTable(); API.simpleAlert('success', 'Succès', res.message); }
  else API.simpleAlert('error', 'Erreur', res.message);
  return false;
}
async function remove(id) {
  const c = await API.confirm('Supprimer', 'Supprimer cette unité ?');
  if (!c.isConfirmed) return;
  const res = await API.post('api/admin/business-units/' + id + '/delete', {});
  if (res.success) { await loadTable(); API.simpleAlert('success', 'Succès', res.message); }
  else API.simpleAlert('error', 'Erreur', res.message);
}
gt = new GeoTable({ renderRow, searchTerms, count: (t, a) => t + (t > 1 ? ' unités' : ' unité') });
loadTable();
</script>
{% endblock %}
