{% extends "backend_base.html" %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Messages de contact</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/Dashboard">Accueil</a></li><li class="breadcrumb-item">Public</li><li class="breadcrumb-item active">Messages</li></ol></nav>
  </div>
  <section class="section">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
          <h5 class="card-title mb-0">Boîte de réception <span id="tableCount" class="badge bg-light text-primary border border-primary fw-normal ms-1"></span></h5>
        </div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
          <div class="position-relative" style="max-width:320px;width:100%;">
            <i class="bi bi-search position-absolute start-0 top-50 translate-middle ms-2 text-muted" style="font-size:.85rem;"></i>
            <input type="text" id="tableSearch" class="form-control form-control-sm ps-4" placeholder="Rechercher un message...">
          </div>
          <div class="d-flex align-items-center gap-2 text-muted small"><span>Lignes :</span><select id="tblPerPage" class="form-select form-select-sm" style="width:90px;"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option></select></div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>#</th><th>Expéditeur</th><th>Sujet</th><th>Contact</th><th>Reçu le</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="tableEmpty" class="text-center text-muted py-5 d-none"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun message trouvé.</div>
          <div id="tableLoading" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="text-muted">Chargement...</span></div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"><span id="tableInfo" class="text-muted small"></span><nav><ul class="pagination pagination-sm mb-0" id="tblPager"></ul></nav></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Détail du message</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="viewBody"></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button><button type="button" class="btn btn-primary" id="markReadBtn">Marquer comme lu</button></div>
  </div></div>
</div>

{% endblock %}
{% block extra_js %}
<script src="/assets/js/localisation-table.js"></script>
<script>
let rows = [], gt = null, current = null;
function renderRow(r, num) {
  return '<tr class="' + (r.is_readed == 0 ? 'fw-semibold' : '') + '"><td class="text-muted">' + num + '</td><td>' + API.esc(r.full_name) + '</td><td>' + API.esc(r.subject || '—') + '</td><td><div class="small">' + API.esc(r.email) + '</div><div class="small text-muted">' + API.esc(r.phone_number || '') + '</div></td><td class="small">' + API.esc((r.date_creation || '').replace('T', ' ').slice(0, 16)) + '</td><td>' + (r.is_readed == 1 ? '<span class="badge bg-success">Lu</span>' : '<span class="badge bg-warning text-dark">Nouveau</span>') + '</td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="view(' + r.id_contact + ')" title="Voir"><i class="bi bi-eye"></i></button><button class="btn btn-sm btn-outline-danger" onclick="remove(' + r.id_contact + ')" title="Supprimer"><i class="bi bi-trash"></i></button></td></tr>';
}
function searchTerms(r) { return [r.full_name, r.email, r.subject, r.message, r.phone_number].join(' '); }
async function loadTable() {
  const r = await API.get('api/admin/contact-messages?limit=200');
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  rows = r.data.data || []; gt.setRows(rows);
}
async function view(id) {
  const r = await API.get('api/admin/contact-messages/' + id);
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  current = r.data;
  const d = current;
  document.getElementById('viewBody').innerHTML = '<div class="mb-3"><strong>' + API.esc(d.subject || '(Sans sujet)') + '</strong></div><div class="row g-2 mb-3 small text-muted"><div class="col-md-6"><i class="bi bi-person me-1"></i>' + API.esc(d.full_name) + '</div><div class="col-md-6"><i class="bi bi-envelope me-1"></i>' + API.esc(d.email) + '</div><div class="col-md-6"><i class="bi bi-telephone me-1"></i>' + API.esc(d.phone_number || '—') + '</div><div class="col-md-6"><i class="bi bi-geo-alt me-1"></i>' + API.esc(d.location || '—') + '</div></div><div class="border rounded p-3 bg-light" style="white-space:pre-wrap;">' + API.esc(d.message) + '</div>';
  document.getElementById('markReadBtn').style.display = d.is_readed == 1 ? 'none' : '';
  bootstrap.Modal.getOrCreateInstance(document.getElementById('viewModal')).show();
}
document.getElementById('markReadBtn').addEventListener('click', async () => {
  if (!current) return;
  const r = await API.post('api/admin/contact-messages/' + current.id_contact + '/read', {});
  if (r.success) { bootstrap.Modal.getInstance(document.getElementById('viewModal')).hide(); await loadTable(); }
  else API.simpleAlert('error', 'Erreur', r.message);
});
async function remove(id) {
  const c = await API.confirm('Supprimer', 'Supprimer ce message ?');
  if (!c.isConfirmed) return;
  const r = await API.post('api/admin/contact-messages/' + id + '/delete', {});
  if (r.success) { await loadTable(); API.simpleAlert('success', 'Succès', r.message); }
  else API.simpleAlert('error', 'Erreur', r.message);
}
gt = new GeoTable({ renderRow, searchTerms, count: (t, a) => t + (t > 1 ? ' messages' : ' message') });
loadTable();
</script>
{% endblock %}
