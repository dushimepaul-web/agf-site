{% extends "backend_base.html" %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Partenaires</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/Dashboard">Accueil</a></li><li class="breadcrumb-item">Public</li><li class="breadcrumb-item active">Partenaires</li></ol></nav>
  </div>
  <section class="section">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
          <h5 class="card-title mb-0">Liste des partenaires <span id="tableCount" class="badge bg-light text-primary border border-primary fw-normal ms-1"></span></h5>
          <button type="button" class="btn btn-primary btn-sm" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Ajouter</button>
        </div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
          <div class="position-relative" style="max-width:320px;width:100%;"><i class="bi bi-search position-absolute start-0 top-50 translate-middle ms-2 text-muted" style="font-size:.85rem;"></i><input type="text" id="tableSearch" class="form-control form-control-sm ps-4" placeholder="Rechercher un partenaire..."></div>
          <div class="d-flex align-items-center gap-2 text-muted small"><span>Lignes :</span><select id="tblPerPage" class="form-select form-select-sm" style="width:90px;"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option></select></div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>#</th><th>Partenaire</th><th>Type</th><th>Niveau</th><th>Pays</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="tableEmpty" class="text-center text-muted py-5 d-none"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun partenaire trouvé.</div>
          <div id="tableLoading" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="text-muted">Chargement...</span></div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"><span id="tableInfo" class="text-muted small"></span><nav><ul class="pagination pagination-sm mb-0" id="tblPager"></ul></nav></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">Ajouter un partenaire</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="editForm" onsubmit="return save(event)">
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-8"><label class="form-label">Nom <span class="text-danger">*</span></label><input type="text" name="nom" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">Type <span class="text-danger">*</span></label><select name="type_partenaire" class="form-select" required><option value="">--</option><option value="commercial">Commercial</option><option value="technique">Technique</option><option value="financier">Financier</option><option value="institutionnel">Institutionnel</option><option value="academique">Académique</option></select></div>
          <div class="col-md-6"><label class="form-label">Niveau</label><select name="niveau_partenariat" class="form-select"><option value="commercial">Commercial</option><option value="strategique">Stratégique</option><option value="premium">Premium</option></select></div>
          <div class="col-md-6"><label class="form-label">Pays</label><input type="text" name="pays" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Site web</label><input type="text" name="site_web" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Date début</label><input type="date" name="date_debut" class="form-control"></div>
          <div class="col-12"><label class="form-label">Logo URL</label><input type="text" name="logo_url" class="form-control"></div>
          <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
          <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="est_actif" id="est_actif" checked><label class="form-check-label" for="est_actif">Actif</label></div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
    </form>
  </div></div>
</div>

{% endblock %}
{% block extra_js %}
<script src="/assets/js/localisation-table.js"></script>
<script>
let rows = [], gt = null;
const editId = {{ edit_id|default:"0" }};
function renderRow(r, num) {
  return '<tr><td class="text-muted">' + num + '</td><td><div class="d-flex align-items-center gap-2">' + (r.logo_url ? '<img src="/' + API.esc(r.logo_url) + '" style="width:38px;height:38px;object-fit:contain;border-radius:6px;background:#f8f9fa;">' : '') + '<span class="fw-semibold">' + API.esc(r.nom) + '</span></div></td><td><span class="badge bg-light text-dark border">' + API.esc(r.type_partenaire || '—') + '</span></td><td>' + API.esc(r.niveau_partenariat || '—') + '</td><td>' + API.esc(r.pays || '—') + '</td><td>' + (r.est_actif == 1 ? '<span class="badge bg-success">Actif</span>' : '<span class="badge bg-secondary">Inactif</span>') + '</td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="openModal(' + r.id_partenaire + ')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="remove(' + r.id_partenaire + ')"><i class="bi bi-trash"></i></button></td></tr>';
}
function searchTerms(r) { return [r.nom, r.type_partenaire, r.niveau_partenariat, r.pays, r.description].join(' '); }
async function loadTable() {
  const r = await API.get('api/admin/partners');
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  rows = r.data || []; gt.setRows(rows);
  if (editId) openModal(editId);
}
function openModal(id) {
  const f = document.getElementById('editForm'); f.reset(); f.dataset.id = '';
  document.getElementById('modalTitle').textContent = 'Ajouter un partenaire';
  if (id) {
    const r = rows.find(x => x.id_partenaire == id); if (!r) return;
    document.getElementById('modalTitle').textContent = 'Modifier le partenaire'; f.dataset.id = r.id_partenaire;
    f.nom.value = r.nom || ''; f.type_partenaire.value = r.type_partenaire || ''; f.niveau_partenariat.value = r.niveau_partenariat || 'commercial'; f.pays.value = r.pays || ''; f.site_web.value = r.site_web || ''; f.date_debut.value = r.date_debut || ''; f.logo_url.value = r.logo_url || ''; f.description.value = r.description || ''; f.est_actif.checked = r.est_actif == 1;
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal')).show();
}
async function save(e) {
  e.preventDefault(); const f = document.getElementById('editForm');
  const data = { nom: f.nom.value, type_partenaire: f.type_partenaire.value, niveau_partenariat: f.niveau_partenariat.value, pays: f.pays.value, site_web: f.site_web.value, date_debut: f.date_debut.value, logo_url: f.logo_url.value, description: f.description.value, est_actif: f.est_actif.checked ? 1 : 0 };
  const id = f.dataset.id;
  const r = id ? await API.post('api/admin/partners/' + id + '/update', data) : await API.post('api/admin/partners', data);
  if (r.success) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); await loadTable(); API.simpleAlert('success', 'Succès', r.message); }
  else API.simpleAlert('error', 'Erreur', r.message);
  return false;
}
async function remove(id) {
  const c = await API.confirm('Supprimer', 'Supprimer ce partenaire ?'); if (!c.isConfirmed) return;
  const r = await API.post('api/admin/partners/' + id + '/delete', {});
  if (r.success) { await loadTable(); API.simpleAlert('success', 'Succès', r.message); } else API.simpleAlert('error', 'Erreur', r.message);
}
gt = new GeoTable({ renderRow, searchTerms, count: (t, a) => t + (t > 1 ? ' partenaires' : ' partenaire') });
loadTable();
</script>
{% endblock %}
