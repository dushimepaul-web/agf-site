{% extends "backend_base.html" %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Questions fréquentes</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/Dashboard">Accueil</a></li><li class="breadcrumb-item">Public</li><li class="breadcrumb-item active">FAQ</li></ol></nav>
  </div>
  <section class="section">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
          <h5 class="card-title mb-0">Liste des FAQ <span id="tableCount" class="badge bg-light text-primary border border-primary fw-normal ms-1"></span></h5>
          <button type="button" class="btn btn-primary btn-sm" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Ajouter</button>
        </div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
          <div class="position-relative" style="max-width:320px;width:100%;"><i class="bi bi-search position-absolute start-0 top-50 translate-middle ms-2 text-muted" style="font-size:.85rem;"></i><input type="text" id="tableSearch" class="form-control form-control-sm ps-4" placeholder="Rechercher une question..."></div>
          <div class="d-flex align-items-center gap-2 text-muted small"><span>Lignes :</span><select id="tblPerPage" class="form-select form-select-sm" style="width:90px;"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option></select></div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>#</th><th>Question</th><th>Catégorie</th><th class="text-center">Ordre</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="tableEmpty" class="text-center text-muted py-5 d-none"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune FAQ trouvée.</div>
          <div id="tableLoading" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="text-muted">Chargement...</span></div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"><span id="tableInfo" class="text-muted small"></span><nav><ul class="pagination pagination-sm mb-0" id="tblPager"></ul></nav></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">Ajouter une FAQ</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="editForm" onsubmit="return save(event)">
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Question <span class="text-danger">*</span></label><textarea name="question" class="form-control" rows="2" required></textarea></div>
        <div class="mb-3"><label class="form-label">Réponse <span class="text-danger">*</span></label><textarea name="reponse" class="form-control" rows="5" required></textarea></div>
        <div class="row g-3">
          <div class="col-md-5"><label class="form-label">Catégorie</label><input type="text" name="categorie" class="form-control" value="general"></div>
          <div class="col-md-3"><label class="form-label">Ordre</label><input type="number" name="ordre" class="form-control" value="0"></div>
          <div class="col-md-4"><label class="form-label">Statut</label><select name="est_publiee" class="form-select"><option value="1">Publiée</option><option value="0">Non publiée</option></select></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
    </form>
  </div></div>
</div>

{% endblock %}
{% block extra_js %}
<script src="/assets/js/localisation-table.js"></script>
<script>
let rows = [], gt = null;
const editId = {{ edit_id|default:"0" }};
function renderRow(r, num) {
  return '<tr><td class="text-muted">' + num + '</td><td><div class="fw-semibold">' + API.esc(r.question) + '</div><div class="small text-muted text-truncate" style="max-width:500px;">' + API.esc(r.reponse || '') + '</div></td><td><span class="badge bg-light text-dark border">' + API.esc(r.categorie || 'general') + '</span></td><td class="text-center">' + (r.ordre || 0) + '</td><td>' + (r.est_publiee == 1 ? '<span class="badge bg-success">Publiée</span>' : '<span class="badge bg-secondary">Brouillon</span>') + '</td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="openModal(' + r.id_faq + ')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="remove(' + r.id_faq + ')"><i class="bi bi-trash"></i></button></td></tr>';
}
function searchTerms(r) { return [r.question, r.reponse, r.categorie].join(' '); }
async function loadTable() {
  const r = await API.get('api/admin/faqs');
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  rows = r.data || []; gt.setRows(rows);
  if (editId) openModal(editId);
}
function openModal(id) {
  const f = document.getElementById('editForm'); f.reset(); f.dataset.id = '';
  document.getElementById('modalTitle').textContent = 'Ajouter une FAQ';
  if (id) {
    const r = rows.find(x => x.id_faq == id); if (!r) return;
    document.getElementById('modalTitle').textContent = 'Modifier la FAQ'; f.dataset.id = r.id_faq;
    f.question.value = r.question || ''; f.reponse.value = r.reponse || ''; f.categorie.value = r.categorie || 'general'; f.ordre.value = r.ordre ?? 0; f.est_publiee.value = r.est_publiee ?? 1;
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal')).show();
}
async function save(e) {
  e.preventDefault(); const f = document.getElementById('editForm');
  const data = { question: f.question.value, reponse: f.reponse.value, categorie: f.categorie.value, ordre: f.ordre.value, est_publiee: f.est_publiee.value };
  const id = f.dataset.id;
  const r = id ? await API.post('api/admin/faqs/' + id + '/update', data) : await API.post('api/admin/faqs', data);
  if (r.success) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); await loadTable(); API.simpleAlert('success', 'Succès', r.message); }
  else API.simpleAlert('error', 'Erreur', r.message);
  return false;
}
async function remove(id) {
  const c = await API.confirm('Supprimer', 'Supprimer cette FAQ ?'); if (!c.isConfirmed) return;
  const r = await API.post('api/admin/faqs/' + id + '/delete', {});
  if (r.success) { await loadTable(); API.simpleAlert('success', 'Succès', r.message); } else API.simpleAlert('error', 'Erreur', r.message);
}
gt = new GeoTable({ renderRow, searchTerms, count: (t, a) => t + (t > 1 ? ' FAQ' : ' FAQ') });
loadTable();
</script>
{% endblock %}
