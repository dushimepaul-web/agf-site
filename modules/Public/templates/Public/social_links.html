{% extends "backend_base.html" %}
{% block content %}

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Réseaux sociaux</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/Dashboard">Accueil</a></li><li class="breadcrumb-item">Public</li><li class="breadcrumb-item active">Réseaux sociaux</li></ol></nav>
  </div>
  <section class="section">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3">
          <h5 class="card-title mb-0">Liens sociaux <span id="tableCount" class="badge bg-light text-primary border border-primary fw-normal ms-1"></span></h5>
          <button type="button" class="btn btn-primary btn-sm" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Ajouter</button>
        </div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
          <div class="position-relative" style="max-width:320px;width:100%;"><i class="bi bi-search position-absolute start-0 top-50 translate-middle ms-2 text-muted" style="font-size:.85rem;"></i><input type="text" id="tableSearch" class="form-control form-control-sm ps-4" placeholder="Rechercher un lien..."></div>
          <div class="d-flex align-items-center gap-2 text-muted small"><span>Lignes :</span><select id="tblPerPage" class="form-select form-select-sm" style="width:90px;"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option></select></div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>#</th><th>Plateforme</th><th>URL</th><th>Icône</th><th class="text-center">Ordre</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div id="tableEmpty" class="text-center text-muted py-5 d-none"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun lien trouvé.</div>
          <div id="tableLoading" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="text-muted">Chargement...</span></div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3"><span id="tableInfo" class="text-muted small"></span><nav><ul class="pagination pagination-sm mb-0" id="tblPager"></ul></nav></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="modalTitle">Ajouter un lien</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="editForm" onsubmit="return save(event)">
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Plateforme <span class="text-danger">*</span></label><input type="text" name="platform" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Label</label><input type="text" name="label" class="form-control"></div>
          <div class="col-12"><label class="form-label">URL <span class="text-danger">*</span></label><input type="text" name="url" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">Classe icône</label><input type="text" name="icon_class" class="form-control" value="bi"></div>
          <div class="col-md-4"><label class="form-label">Nom icône</label><input type="text" name="icon_name" class="form-control" placeholder="facebook"></div>
          <div class="col-md-4"><label class="form-label">Ordre</label><input type="number" name="display_order" class="form-control" value="0"></div>
          <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="is_active" id="is_active" checked><label class="form-check-label" for="is_active">Actif</label></div></div>
          <div class="col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="target_blank" id="target_blank" checked><label class="form-check-label" for="target_blank">Nouvel onglet</label></div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
    </form>
  </div></div>
</div>

{% endblock %}
{% block extra_js %}
<script src="/assets/js/localisation-table.js"></script>
<script>
let rows = [], gt = null;
function renderRow(r, num) {
  return '<tr><td class="text-muted">' + num + '</td><td class="fw-semibold"><i class="' + API.esc(r.icon_class || 'bi') + ' ' + API.esc(r.icon_class === 'bi' ? 'bi-' + (r.icon_name || r.platform) : r.icon_name || '') + ' me-1"></i>' + API.esc(r.platform) + '</td><td class="text-truncate" style="max-width:280px;"><a href="' + API.esc(r.url) + '" target="_blank">' + API.esc(r.url) + '</a></td><td><code>' + API.esc((r.icon_class || '') + ' ' + (r.icon_name || '')) + '</code></td><td class="text-center">' + (r.display_order || 0) + '</td><td>' + (r.is_active == 1 ? '<span class="badge bg-success">Actif</span>' : '<span class="badge bg-secondary">Inactif</span>') + '</td><td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="openModal(' + r.id + ')"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="remove(' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
}
function searchTerms(r) { return [r.platform, r.label, r.url].join(' '); }
async function loadTable() {
  const r = await API.get('api/admin/social-links');
  if (!r.success) return API.simpleAlert('error', 'Erreur', r.message);
  rows = r.data || []; gt.setRows(rows);
}
function openModal(id) {
  const f = document.getElementById('editForm'); f.reset(); f.dataset.id = '';
  document.getElementById('modalTitle').textContent = 'Ajouter un lien'; f.icon_class.value = 'bi'; f.target_blank.checked = true; f.is_active.checked = true;
  if (id) {
    const r = rows.find(x => x.id == id); if (!r) return;
    document.getElementById('modalTitle').textContent = 'Modifier le lien'; f.dataset.id = r.id;
    f.platform.value = r.platform || ''; f.label.value = r.label || ''; f.url.value = r.url || ''; f.icon_class.value = r.icon_class || 'bi'; f.icon_name.value = r.icon_name || ''; f.display_order.value = r.display_order ?? 0; f.is_active.checked = r.is_active == 1; f.target_blank.checked = r.target_blank == 1;
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal')).show();
}
async function save(e) {
  e.preventDefault(); const f = document.getElementById('editForm');
  const data = { platform: f.platform.value, label: f.label.value, url: f.url.value, icon_class: f.icon_class.value, icon_name: f.icon_name.value, display_order: f.display_order.value, is_active: f.is_active.checked ? 1 : 0, target_blank: f.target_blank.checked ? 1 : 0 };
  const id = f.dataset.id;
  const r = id ? await API.post('api/admin/social-links/' + id + '/update', data) : await API.post('api/admin/social-links', data);
  if (r.success) { bootstrap.Modal.getInstance(document.getElementById('editModal')).hide(); await loadTable(); API.simpleAlert('success', 'Succès', r.message); }
  else API.simpleAlert('error', 'Erreur', r.message);
  return false;
}
async function remove(id) {
  const c = await API.confirm('Supprimer', 'Supprimer ce lien ?'); if (!c.isConfirmed) return;
  const r = await API.post('api/admin/social-links/' + id + '/delete', {});
  if (r.success) { await loadTable(); API.simpleAlert('success', 'Succès', r.message); } else API.simpleAlert('error', 'Erreur', r.message);
}
gt = new GeoTable({ renderRow, searchTerms, count: (t, a) => t + (t > 1 ? ' liens' : ' lien') });
loadTable();
</script>
{% endblock %}
