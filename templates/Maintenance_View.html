<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Maintenance — {{ nom_app|default:"A.G.F" }}</title>
  <link href="{{ favicon_url|default:'/assets/images/favicon.png' }}" rel="icon">
</head>

<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f4f7f6;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;color:#1f2d3d;">

  <main style="width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 18px 45px rgba(15,40,30,.12);padding:40px 32px;text-align:center;">
    <img src="{{ logo_url|default:'/assets/images/logo.png' }}" alt="{{ nom_app|default:'A.G.F' }}" style="max-height:72px;max-width:100%;margin-bottom:24px;">

    <div style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#fff4e5;color:#b26a00;font-size:30px;margin-bottom:16px;">
      <span aria-hidden="true">&#9888;</span>
    </div>

    <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;">Site en maintenance</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#5b6b7a;">
      Le site <strong>{{ nom_app|default:"A.G.F" }}</strong> est temporairement indisponible.
      Nous revenons très vite. Merci de votre patience.
    </p>

    <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">
      <a href="/" style="display:inline-block;padding:11px 20px;border-radius:10px;background:#1f7a4d;color:#fff;text-decoration:none;font-weight:600;font-size:14px;">Réessayer</a>
      <a href="/Admin" style="display:inline-block;padding:11px 20px;border-radius:10px;border:1px solid #d5dde3;color:#33475b;text-decoration:none;font-weight:600;font-size:14px;">Connexion administrateur</a>
    </div>
  </main>

</body>

</html>
