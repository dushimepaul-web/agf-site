{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>{{ title|default:nom_app }}</title>
  <meta content="{{ nom_app }}" name="description">
  <meta content="" name="keywords">

  <!-- Open Graph / WhatsApp Preview -->
  <meta property="og:title" content="{{ title|default:nom_app }}">
  <meta property="og:description" content="Plateforme de surveillance épidémiologique et sanitaire">
  <meta property="og:image" content="{{ logo_url }}">
  <meta property="og:type" content="website">

  <link href="{{ favicon_url }}" rel="icon" type="image/jpeg">
  <link href="{{ logo_url }}" rel="apple-touch-icon" type="image/jpeg">

  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/boxicons/css/boxicons.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/remixicon/remixicon.css' %}" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">

  <script>
    if (typeof BASE_URL === 'undefined') {
      var BASE_URL = "/";
    }
    if (typeof CSRF_TOKEN === 'undefined') {
      var CSRF_TOKEN = "{{ csrf_token }}";
    }
  </script>
  <script src="{% static 'js/api.js' %}"></script>
</head>

<body>

  <header id="header" class="header fixed-top d-flex align-items-center">

    <div class="d-flex align-items-center justify-content-between">
      <a href="/Dashboard" class="logo d-flex align-items-center">
        <img src="{{ logo_url }}" alt="">
        <span class="d-none d-lg-block">{{ nom_app }}</span>
      </a>
      <i class="bi bi-list toggle-sidebar-btn"></i>
    </div>

    <nav class="header-nav ms-auto">
      <ul class="d-flex align-items-center">
        <li class="nav-item dropdown pe-3">

          <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle fs-4"></i>
            <span class="d-none d-md-block dropdown-toggle ps-2">{{ current_user.full_name|default:"Utilisateur" }}</span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
            <li class="dropdown-header">
              <h6>{{ current_user.full_name|default:"" }}</h6>
              <span>{{ current_user.role_label|default:"" }}</span>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center" href="/Profile">
                <i class="bi bi-person"></i>
                <span>Mon profil</span>
              </a>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="dropdown-item d-flex align-items-center w-100 border-0 bg-transparent">
                  <i class="bi bi-box-arrow-right"></i>
                  <span>Déconnexion</span>
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

  </header>
